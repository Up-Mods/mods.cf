<!DOCTYPE HTML>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
    <!-- other meta properties -->
    <meta charset="UTF-8">
    <link rel="canonical" href="{PROJECT_URL}">
    <title>{PROJECT_TITLE}</title>
    <meta name="description" content="{PROJECT_SUMMARY}">

    <!-- OpenGraph data -->
    <!-- https://ogp.me -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{PROJECT_URL}">
    <meta property="og:title" content="{PROJECT_TITLE}">
    <meta property="og:description" content="{PROJECT_SUMMARY}">
    <meta property="og:image" content="{PROJECT_ICON_URL}">
    <meta property="og:image:width" content="400">
    <meta property="og:image:height" content="400">
    <meta property="og:site_name" content="CurseForge">

    <!-- Discord metadata -->
    <link rel="discord:component-embed" href="{COMPONENT_JSON_URL}" type="application/json" as="json">
</head>
</html>
