[package]
name = "mods_cf"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-test = "21.1.0"
bytes = { version = "1.12.1", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = { git = "https://github.com/allan2/dotenvy", rev = "fa25166994d6978bd2e002f0ed190c0c39674ebe", features = ["macros"] }
extension-traits = "2.0.3"
human-repr = "1.1.0"
posthog-rs = { version = "0.27.0", features = ["capture-v1"] }
reqwest = { version = "0.13.5", features = ["json", "gzip", "brotli", "zstd", "deflate"] }
rootcause = "0.13.0"
rust-i18n = "4.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-map-to-array = { version = "3.0.0", features = ["std"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_repr = "0.1.21"
serde_with = "3.23.0"
string-truncate = "0.1.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = { version = "0.1.44", features = ["async-await"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twilight-model = "0.17.1"
twilight-util = { version = "0.17.0", features = ["builder"] }
url = { version = "2.5.8", features = ["serde"] }
